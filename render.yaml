# Render Blueprint — deploys the ROSYNX NestJS API.
# In Render: New → Blueprint → connect this repo → it reads this file.
# Fill in the secret env vars (marked sync:false) in the Render dashboard.
services:
  - type: web
    name: rosynx-api
    runtime: node
    rootDir: backend
    plan: free
    # Co-locate with the Neon database (Singapore) — a cross-region backend↔DB
    # link adds ~180ms per query, which compounds to multi-second API calls.
    region: singapore
    branch: main
    # --include=dev is required: NestJS build tools (@nestjs/cli, typescript)
    # are devDependencies and NODE_ENV=production would otherwise skip them.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/categories
    envVars:
      - key: NODE_ENV
        value: production
      # Neon Postgres — paste from backend/.env
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Auth secrets
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 60m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # Comma-separated list of allowed browser origins (the Vercel URLs).
      # e.g. https://rosynx-store.vercel.app,https://rosynx-admin.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Cloudinary image storage
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BASE_CURRENCY
        value: USD
      # Email delivery (Brevo HTTP API). Order confirmations, support replies,
      # coupon broadcasts and verify/reset OTPs all send through this. Brevo
      # sends over HTTPS (port 443), so it works on Render's free tier — which
      # blocks ALL outbound SMTP (Gmail/nodemailer times out on 465 AND 587).
      # Free 300 emails/day and delivers to ANY recipient after a single-sender
      # verification (verify one Gmail by clicking Brevo's link — no domain).
      # Set EMAIL_PROVIDER=brevo + paste BREVO_API_KEY (Brevo → SMTP & API →
      # API Keys). EMAIL_FROM must be a Brevo-verified sender. Leave provider
      # unset/console and emails are only logged.
      # (Resend is inert unless EMAIL_PROVIDER=resend; it only delivers to the
      # account owner without a verified domain, so Brevo is the live path.)
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      # Must match a Brevo-verified sender exactly (verified 2026-07-30).
      - key: EMAIL_FROM
        value: ROSYNX <rosynxsupport@gmail.com>
      - key: SUPPORT_EMAIL
        sync: false
      # Keep Neon awake so the first request isn't a cold start. Note this only
      # runs while the process is alive — see SELF_URL below.
      - key: DB_KEEPALIVE
        value: "true"
      # Keep-alive: the service pings its own PUBLIC url every 10 min, which
      # arrives as inbound traffic and resets Render's ~15 min idle timer, so the
      # free instance never spins down (a cold start costs the first visitor
      # ~9s). Keeping the process alive also keeps DB_KEEPALIVE running, which
      # stops Neon scaling to zero — one ping prevents both cold starts.
      # An always-on free instance uses ~730 of the 750 free instance-hours/month,
      # so this only works with a single free service. Unset to disable.
      - key: SELF_URL
        value: https://rosynx-api.onrender.com
      # On-demand revalidation: after an admin edit the API calls the storefront
      # so the change is live in seconds instead of waiting out the ISR window.
      # STOREFRONT_URL must have no trailing slash. REVALIDATE_SECRET must match
      # the value set on the Vercel storefront project.
      - key: STOREFRONT_URL
        value: https://rosynx-store.vercel.app
      - key: REVALIDATE_SECRET
        sync: false
